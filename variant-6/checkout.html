document.addEventListener('DOMContentLoaded',function(){
 var b=document.querySelector('.burger'),n=document.querySelector('.mainnav');

 var f=document.querySelector('form.cform');

 var filt=document.querySelector('.filters');
 if(filt){var cards=[].slice.call(document.querySelectorAll('.pcard,.hcard'));var boxes=[].slice.call(filt.querySelectorAll('input[type=checkbox]'));
  function apply(){var groups={};boxes.forEach(function(x){var f=x.getAttribute('data-f');if(x.checked&&f){(groups[f]=groups[f]||[]).push(x.value);}});
   cards.forEach(function(c){var show=true;Object.keys(groups).forEach(function(f){var vals=(c.getAttribute('data-'+f)||'').split(' ');if(!groups[f].some(function(v){return vals.indexOf(v)>-1;}))show=false;});c.style.display=show?'':'none';});}

document.addEventListener('DOMContentLoaded',function(){
/* D5: animated drawer - overlay, close controls, split-nav merge on mobile */
var navs=[].slice.call(document.querySelectorAll('.mainnav'));
var nav=navs[0],burger=document.querySelector('.burger');
if(nav&&burger){
  var ov=document.createElement('div');ov.className='nav-overlay';document.body.appendChild(ov);
  var cb=document.createElement('button');cb.type='button';cb.className='nav-close';cb.setAttribute('aria-label','Close menu');cb.innerHTML='&#10005;';nav.insertBefore(cb,nav.firstChild);
  function sync(){document.body.classList.toggle('nav-open',nav.classList.contains('open'));}
  function shut(){nav.classList.remove('open');sync();}
  burger.addEventListener('click',function(){setTimeout(sync,0);});
  cb.addEventListener('click',shut);
  ov.addEventListener('click',shut);
  nav.addEventListener('click',function(e){var a=e.target.closest?e.target.closest('a'):null;if(!a)return;var href=a.getAttribute('href');var wasOpen=nav.classList.contains('open');shut();if(href&&href.indexOf('http')!==0&&/\.html($|[?#])/.test(href)&&(wasOpen||window.innerWidth<=900)){e.preventDefault();window.location.href=href;}});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')shut();});
  if(navs.length>1){
    var second=navs[1],moved=null,mq=window.matchMedia('(max-width:900px)');
    function toDrawer(){if(moved===null){moved=[].slice.call(second.childNodes);moved.forEach(function(n){nav.appendChild(n);});second.style.display='none';}}
    function toSplit(){if(moved!==null){moved.forEach(function(n){second.appendChild(n);});second.style.display='';moved=null;}}
    function applyMQ(){if(mq.matches)toDrawer();else toSplit();}
    if(mq.addEventListener)mq.addEventListener('change',applyMQ);else if(mq.addListener)mq.addListener(applyMQ);
    applyMQ();
  }
}
/* D2: blog category select on small screens, wired to the same pills */
var pills=[].slice.call(document.querySelectorAll('.pill'));
if(pills.length){
  var row=pills[0].closest('.pills,.catrow')||pills[0].parentElement;
  var sel=document.createElement('select');sel.className='pill-select';sel.setAttribute('aria-label','Choose a category');
  pills.forEach(function(p){var o=document.createElement('option');o.value=p.getAttribute('data-pill');o.textContent=p.textContent.replace(/\s+/g,' ').trim();if(p.classList.contains('on'))o.selected=true;sel.appendChild(o);});
  row.parentNode.insertBefore(sel,row.nextSibling);
  sel.addEventListener('change',function(){var t=pills.filter(function(x){return x.getAttribute('data-pill')===sel.value;})[0];if(t)t.click();});
}
/* D4: FAQ accordion, progressive enhancement */
function accOpen(rec){rec.it.classList.add('acc-open');if(rec.mark)rec.mark.textContent='\u2212';rec.w.style.height=rec.w.scrollHeight+'px';setTimeout(function(){if(rec.it.classList.contains('acc-open'))rec.w.style.height='auto';},330);}
function accClose(rec){rec.it.classList.remove('acc-open');if(rec.mark)rec.mark.textContent='+';rec.w.style.height=rec.w.scrollHeight+'px';setTimeout(function(){rec.w.style.height='0px';},20);}
function setupAcc(itemSel,headSel){
  var items=[].slice.call(document.querySelectorAll(itemSel));if(!items.length)return;
  var recs=[];
  items.forEach(function(it){
    var head=it.querySelector(headSel);if(!head)return;
    var ans=[],n=head.nextElementSibling;while(n){ans.push(n);n=n.nextElementSibling;}
    if(!ans.length)return;
    var w=document.createElement('div');w.className='acc-a';
    head.parentNode.insertBefore(w,ans[0]);ans.forEach(function(a){w.appendChild(a);});
    recs.push({it:it,head:head,w:w,mark:head.querySelector('.mark')});
  });
  recs.forEach(function(rec,idx){
    if(idx===0){rec.it.classList.add('acc-open');if(rec.mark)rec.mark.textContent='\u2212';}
    else{rec.w.style.height='0px';}
    rec.head.addEventListener('click',function(){
      var isOpen=rec.it.classList.contains('acc-open');
      recs.forEach(function(r){if(r!==rec&&r.it.classList.contains('acc-open'))accClose(r);});
      if(isOpen)accClose(rec);else accOpen(rec);
    });
  });
}
setupAcc('.fq-item','h3');
setupAcc('.qa-card','h3');
/* D4 for V1 native details: animate height, keep details semantics */
var dets=[].slice.call(document.querySelectorAll('details.faq-item'));
if(dets.length){
  var drecs=[];
  dets.forEach(function(d){
    var sum=d.querySelector('summary');if(!sum)return;
    var w=document.createElement('div');w.className='faq-a';
    [].slice.call(d.childNodes).forEach(function(n){if(n!==sum)w.appendChild(n);});
    d.appendChild(w);
    if(!d.hasAttribute('open'))w.style.height='0px';
    drecs.push({d:d,sum:sum,w:w});
  });
  function dClose(rec){rec.w.style.height=rec.w.scrollHeight+'px';setTimeout(function(){rec.w.style.height='0px';},20);setTimeout(function(){rec.d.removeAttribute('open');},310);}
  function dOpen(rec){rec.d.setAttribute('open','');rec.w.style.height='0px';setTimeout(function(){rec.w.style.height=rec.w.scrollHeight+'px';},20);setTimeout(function(){if(rec.d.hasAttribute('open'))rec.w.style.height='auto';},340);}
  drecs.forEach(function(rec){
    rec.sum.addEventListener('click',function(e){
      e.preventDefault();
      var isOpen=rec.d.hasAttribute('open');
      drecs.forEach(function(r){if(r!==rec&&r.d.hasAttribute('open'))dClose(r);});
      if(isOpen)dClose(rec);else dOpen(rec);
    });
  });
}
});

<script data-cart>
document.addEventListener('DOMContentLoaded',function(){
var PROD={'box24':{name:'Black Horse Vital Honey',desc:'Box of 24 Sachets (10g each)',facts:'100% natural, with Royal Jelly, Panax Ginseng & Rainforest Herbs.',img:'../assets/boxes-web.jpg'},
};
var cart={};try{var raw=localStorage.getItem('bh-cart');if(raw)cart=JSON.parse(raw)||{};}catch(e){cart={};}
if(!Object.keys(cart).length){try{var m=document.cookie.match(/(?:^|; )bh-cart=([^;]*)/);if(m)cart=JSON.parse(decodeURIComponent(m[1]))||{};}catch(e){cart={};}}
function save(){try{localStorage.setItem('bh-cart',JSON.stringify(cart));}catch(e){try{document.cookie='bh-cart='+encodeURIComponent(JSON.stringify(cart))+';path=/;max-age=86400;SameSite=Lax';}catch(e2){}}}
function count(){var c=0;for(var k in cart)if(PROD[k])c+=cart[k];return c;}
function paint(){var c=count();[].slice.call(document.querySelectorAll('[data-cart-count]')).forEach(function(b){b.textContent=c;var l=b.closest('.cart-link,.cart-nav-link');if(l)l.classList.toggle('has',c>0);});}
function qtyNear(el){var s=el.closest('.qtyrow,.prod,.dp-grid,.hcard,.rcard,.pcard,.panel,.showcase,.dark-panel,.split,.boxline,.closeband');var i=s?s.querySelector('.qty input'):null;var v=i?parseInt(i.value,10):1;return(isNaN(v)||v<1)?1:v;}
function add(id,q,btn){if(!PROD[id])return;cart[id]=(cart[id]||0)+q;save();paint();renderCart();
  if(btn){var t=btn.textContent;btn.textContent='ADDED';setTimeout(function(){btn.textContent=t;},1100);}}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function renderCart(){
  var box=document.getElementById('cart-items');var cl=document.getElementById('cart-count-line');
  if(cl)cl.textContent=count();
  var co=document.getElementById('co-items');
  if(co){var ch='';for(var k in cart){if(!PROD[k])continue;ch+='<div class="co-item"><span>'+esc(PROD[k].name)+' &times; '+cart[k]+'</span><span>Price on request</span></div>';}
    co.innerHTML=ch||'<div class="co-item"><span>Your cart is empty.</span><span></span></div>';}
  if(!box)return;
  var empty=document.getElementById('cart-empty');var sum=document.getElementById('cart-box');
  var keys=Object.keys(cart).filter(function(k){return PROD[k]&&cart[k]>0;});
  if(!keys.length){box.innerHTML='';if(empty)empty.style.display='';if(sum)sum.style.display='none';return;}
  if(empty)empty.style.display='none';if(sum)sum.style.display='';
  box.innerHTML=keys.map(function(k){var p=PROD[k];
    var pic=p.img?'<img src="'+p.img+'" alt="'+esc(p.name)+'">':'<div class="slot-photo">PRODUCT PHOTO<br>TO COME</div>';
    return '<div class="cart-row">'+pic+'<div class="ci"><b>'+esc(p.name)+'</b><span>'+esc(p.desc)+' &middot; Price on request</span></div><div class="cqty"><button type="button" data-dec="'+k+'" aria-label="Minus">-</button><input value="'+cart[k]+'" aria-label="Quantity" readonly><button type="button" data-inc="'+k+'" aria-label="Plus">+</button></div><button type="button" class="cart-remove" data-remove="'+k+'" aria-label="Remove">&#10005;</button></div>';}).join('');
}
document.addEventListener('click',function(e){
  var t=e.target.closest?e.target:null;if(!t)return;
  var addB=t.closest('[data-add]');if(addB){add(addB.getAttribute('data-add'),qtyNear(addB),addB);return;}
  var inc=t.closest('[data-inc]');if(inc){cart[inc.getAttribute('data-inc')]++;save();paint();renderCart();return;}
  var dec=t.closest('[data-dec]');if(dec){var k=dec.getAttribute('data-dec');cart[k]--;if(cart[k]<=0)delete cart[k];save();paint();renderCart();return;}
  var rem=t.closest('[data-remove]');if(rem){delete cart[rem.getAttribute('data-remove')];save();paint();renderCart();return;}
});

if(cof)cof.addEventListener('submit',function(e){e.preventDefault();cart={};save();paint();window.location.href='thank-you.html';});

paint();renderCart();
});
